services:
  # --- BLOQUE MQTT ---
  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: iot-mqtt-broker
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto:/mosquitto/config
      - ./mosquitto_data:/mosquitto/data
      - ./mosquitto_log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -u iot_user -P iot_password -t '$$SYS/#' -C 1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - shared-network

  mqtt-explorer:
    image: smeagolworms4/mqtt-explorer
    container_name: mqtt-explorer
    restart: unless-stopped
    ports:
      - "4000:4000"
    depends_on:
      mqtt-broker:
        condition: service_healthy
    networks:
      - shared-network

  sensor-simulator:
    build:
      context: ./mosquitto/src
      dockerfile: Dockerfile
    container_name: iot-sensor-simulator
    restart: unless-stopped
    depends_on:
      mqtt-broker:
        condition: service_healthy
    command: python -u sensor_simulator.py
    environment:
      - BROKER_HOST=mqtt-broker
      - BROKER_PORT=1883
      - ACTIVE_MOTORS=1,2,3,4,5
      - SIMULATION_SPEED_MS=1500
      - MQTT_USER=iot_user
      - MQTT_PASSWORD=iot_password
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; cmd = open('/proc/1/cmdline').read(); sys.exit(0 if 'sensor_simulator.py' in cmd else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - shared-network

  data-consumer:
    build:
      context: ./mosquitto/src
      dockerfile: Dockerfile
    container_name: iot-data-consumer
    restart: unless-stopped
    depends_on:
      mqtt-broker:
        condition: service_healthy
      influxdb2:
        condition: service_healthy
    command: python -u data_consumer.py
    env_file:
      - .env
    environment:
      - BROKER_HOST=mqtt-broker
      - BROKER_PORT=1883
      - INFLUXDB_URL=http://influxdb2:8086
      - MQTT_USER=iot_user
      - MQTT_PASSWORD=iot_password
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; cmd = open('/proc/1/cmdline').read(); sys.exit(0 if 'data_consumer.py' in cmd else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - shared-network

  # --- BLOQUE INFLUXDB ---
  influxdb2:
    image: influxdb:2
    container_name: influxdb2
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME_FILE: /run/secrets/influxdb2-admin-username
      DOCKER_INFLUXDB_INIT_PASSWORD_FILE: /run/secrets/influxdb2-admin-password
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN_FILE: /run/secrets/influxdb2-admin-token
      DOCKER_INFLUXDB_INIT_ORG: docs
      DOCKER_INFLUXDB_INIT_BUCKET: home
    secrets:
      - influxdb2-admin-username
      - influxdb2-admin-password
      - influxdb2-admin-token
    volumes:
      - influxdb2-data:/var/lib/influxdb2
      - influxdb2-config:/etc/influxdb2
      - ./influxdb/flux-scripts:/flux-scripts:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - shared-network

  # --- BLOQUE API BACKEND (FastAPI) ---
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: iot-api-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      influxdb2:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - INFLUXDB_URL=http://influxdb2:8086
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - shared-network

  # --- BLOQUE DASHBOARD FRONTEND (Streamlit) ---
  streamlit-app:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: iot-streamlit-dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    environment:
      - API_URL=http://api:8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - shared-network

networks:
  shared-network:
    driver: bridge

secrets:
  influxdb2-admin-username:
    file: ./influxdb/.env.influxdb2-admin-username
  influxdb2-admin-password:
    file: ./influxdb/.env.influxdb2-admin-password
  influxdb2-admin-token:
    file: ./influxdb/.env.influxdb2-admin-token

volumes:
  influxdb2-data:
  influxdb2-config: